[project]
name = "pipecat-ai-purr"
dynamic = ["version"]  # from the git tag (setuptools_scm), as pipecat's
description = "A human-in-the-loop agentic code reviewer."
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["code review", "github", "pull requests", "claude", "agents", "tui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "aiosqlite>=0.22.1",
    "claude-agent-sdk>=0.2.187",
    "loguru>=0.7.3",
    "pipecat-ai>=1.16.0",
    "pyyaml>=6.0.4",
    "textual>=8.2.8",
    "typer>=0.20.0",
]

[project.urls]
Source = "https://github.com/pipecat-ai/purr"
Issues = "https://github.com/pipecat-ai/purr/issues"
Documentation = "https://github.com/pipecat-ai/purr/blob/main/docs/purr.md"

[project.scripts]
purr = "purr.cli:main"

[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

# The package is purr, whatever the distribution is called; with it, every file git
# tracks in it (purr.tcss). MANIFEST.in keeps the README's GIF out of the sdist.
[tool.setuptools.packages.find]
where = ["src"]

# The version is the last tag's (v0.1.0: 0.1.0), and between tags the next one's dev
# release (0.1.1.dev3); without git, 0.0.0-dev.
[tool.setuptools_scm]
local_scheme = "no-local-version"
fallback_version = "0.0.0-dev"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
    "pytest-timeout>=2.3",
    "ruff>=0.12.11",
    "towncrier~=25.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A test stuck for this long fails, with where it was stuck, rather than hanging CI.
timeout = 120
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Changes go in changelog/ as fragments (<PR number>.<type>.md, or +<name>.<type>.md for
# one without a PR), each a bullet; `towncrier build --version X.Y.Z` puts them in
# CHANGELOG.md when releasing.
[tool.towncrier]
package = "purr"
package_dir = "src"
filename = "CHANGELOG.md"
directory = "changelog"
start_string = "<!-- towncrier release notes start -->\n"
template = "changelog/_template.md.j2"
title_format = "## [{version}] - {project_date}"
issue_format = "[#{issue}](https://github.com/pipecat-ai/purr/pull/{issue})"
underlines = ["", "", ""]
wrap = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "performance"
name = "Performance"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[[tool.towncrier.type]]
directory = "other"
name = "Other"
showcontent = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
