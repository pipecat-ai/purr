[project]
name = "purr"
version = "0.1.0"
description = "Review GitHub pull requests with Claude from a keyboard TUI or by voice."
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "claude-agent-sdk>=0.2.187",
    "loguru>=0.7.3",
    "pipecat-ai>=1.16.0",
    "pyyaml>=6.0.4",
    "textual>=8.2.8",
]

[project.scripts]
purr = "purr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.12.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
