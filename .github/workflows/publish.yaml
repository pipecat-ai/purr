name: publish

# Releases a tag: builds it, publishes it to PyPI (trusted publishing: the "pypi"
# environment, set up on PyPI for this repo and workflow), then makes the GitHub
# release, with the tag's section of CHANGELOG.md as its notes.

on:
  workflow_dispatch:
    inputs:
      gitref:
        type: string
        description: "what git tag to release (e.g. v0.1.0)"
        required: true

env:
  PACKAGE: pipecat-ai-purr # its name on PyPI

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.gitref }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.13

      # Before anything is published: a tag with no section in CHANGELOG.md stops here.
      - name: Check the changelog has this version
        env:
          GITREF: ${{ github.event.inputs.gitref }}
        run: uv run python scripts/release_changelog.py "${GITREF#v}" > /dev/null

      - name: Test
        run: |
          uv sync --group dev
          uv run pytest -q

      - name: Build project
        run: uv build

      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: ./dist

  publish-to-pypi:
    name: "Publish to PyPI"
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: pypi
      url: https://pypi.org/p/${{ env.PACKAGE }}
    permissions:
      id-token: write
    steps:
      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: ./dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          verbose: true
          print-hash: true

  # Once the package can be installed from PyPI, so the release never points at a
  # version nobody can install yet.
  github-release:
    name: "Create GitHub Release"
    runs-on: ubuntu-latest
    needs: [publish-to-pypi]
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.gitref }}

      # The tag's section of CHANGELOG.md, without its heading: the release's title
      # already says the version.
      - name: Release notes from the changelog
        env:
          GITREF: ${{ github.event.inputs.gitref }}
        run: python3 scripts/release_changelog.py --no-heading "${GITREF#v}" > release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITREF: ${{ github.event.inputs.gitref }}
        run: |
          if gh release view "$GITREF" >/dev/null 2>&1; then
            gh release edit "$GITREF" --notes-file release-notes.md
          else
            gh release create "$GITREF" --title "$GITREF" --notes-file release-notes.md --verify-tag
          fi
