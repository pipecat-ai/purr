name: generate-changelog

# Gets a release ready: the changelog fragments in changelog/ go into CHANGELOG.md
# (towncrier), as a pull request. Merging it, tagging vX.Y.Z (the version comes from the
# tag) and running publish with the tag makes the release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.1)"
        required: true
        type: string
      date:
        description: "Release date (YYYY-MM-DD; today if empty)"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-changelog:
    name: "Generate changelog"
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      DATE: ${{ inputs.date }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --group dev

      - name: Check the version and date
        id: release
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([a-z0-9.+-]*)$ ]]; then
            echo "Error: the version must be X.Y.Z (e.g. 0.1.1), not '$VERSION'"
            exit 1
          fi
          if [ -z "$DATE" ]; then
            DATE=$(date +%Y-%m-%d)
          elif ! [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || ! date -d "$DATE" >/dev/null 2>&1; then
            echo "Error: the date must be YYYY-MM-DD, not '$DATE'"
            exit 1
          fi
          echo "Releasing $VERSION on $DATE"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Check the changelog fragments
        id: fragments
        run: |
          # <PR number>.<type>[.<n>].md, or +<name>.<type>[.<n>].md for a change without a PR.
          VALID_TYPES="added changed deprecated removed fixed performance security other"
          COUNT=0
          INVALID=""
          for file in changelog/*.md; do
            [ -e "$file" ] || continue
            COUNT=$((COUNT + 1))
            name=$(basename "$file")
            type=$(echo "$name" | sed -E 's/^(\+[^.]+|[0-9]+)\.([a-z]+)(\.[0-9]+)?\.md$/\2/')
            if ! echo "$VALID_TYPES" | grep -wq -- "$type"; then
              INVALID="$INVALID\n  - $name"
            fi
          done
          if [ "$COUNT" -eq 0 ]; then
            echo "Error: no changelog fragments in changelog/"
            exit 1
          fi
          if [ -n "$INVALID" ]; then
            echo -e "Error: these fragments aren't <PR number>.<type>.md:$INVALID"
            echo "The types are: $VALID_TYPES"
            exit 1
          fi
          echo "Found $COUNT changelog fragment(s)"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Preview the changelog
        run: uv run towncrier build --draft --version "$VERSION" --date "${{ steps.release.outputs.date }}"

      - name: Build the changelog
        run: uv run towncrier build --version "$VERSION" --date "${{ steps.release.outputs.date }}" --yes

      - name: Create the pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Update the changelog for ${{ inputs.version }}"
          title: "Release ${{ inputs.version }}"
          body: |
            The notes for **${{ inputs.version }}** in `CHANGELOG.md`, from ${{ steps.fragments.outputs.count }} changelog fragment(s), dated ${{ steps.release.outputs.date }}.

            Once it's merged, tag the merge commit `v${{ inputs.version }}` (the version comes from the tag), push the tag, and run the **publish** workflow with it.
          branch: release-${{ inputs.version }}
          delete-branch: true
          labels: |
            changelog
            release
