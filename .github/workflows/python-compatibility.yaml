name: Python Compatibility Test

on:
  push:
    branches: [main]
    paths: ["pyproject.toml"]
  pull_request:
    branches: [main]
    paths: ["pyproject.toml"]
  # Scheduled and manual runs ignore uv.lock and install the newest allowed
  # versions, as a user's fresh install would, so upstream releases that break
  # Purr show up without any change here.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  test-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    name: Python ${{ matrix.python-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          enable-cache: false

      - name: Set up Python ${{ matrix.python-version }}
        run: |
          uv python install ${{ matrix.python-version }}
          uv python pin ${{ matrix.python-version }}

      - name: Install
        run: |
          uv sync --group dev ${{ github.event_name != 'push' && github.event_name != 'pull_request' && '--upgrade' || '' }}

      - name: Verify installation
        run: |
          uv run python --version
          uv run purr --version

      - name: Test
        run: uv run pytest -q
